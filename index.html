<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 与 PC、H5 页面同一写法，保证量到的视口与线上页面一致 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折叠屏测量</title>
<style>
  :root { --bg:#fff; --fg:#1d1e1f; --mute:#6b6f76; --line:#e3e5e8; --pc:#1f6feb; --h5:#d4570b; --card:#f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141517; --fg:#eceef1; --mute:#9aa0a8; --line:#2c2f33; --card:#1d1f22; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .hint { color:var(--mute); font-size:13px; margin:0 0 12px; }
  .verdict { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .pill { flex:1 1 140px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--card); }
  .pill b { display:block; font-size:22px; }
  .pc { color:var(--pc); } .h5 { color:var(--h5); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { border-bottom:1px solid var(--line); padding:6px 4px; vertical-align:top; word-break:break-all; }
  td:first-child { color:var(--mute); white-space:nowrap; padding-right:12px; width:1%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button.primary { background:var(--pc); color:#fff; border-color:var(--pc); }
  textarea { width:100%; height:140px; font:12px/1.4 ui-monospace, Menlo, monospace; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  h2 { font-size:16px; margin:20px 0 6px; }
  .log td:first-child { white-space:normal; }
</style>
</head>
<body>
<h1>折叠屏测量</h1>
<p class="hint">只读页面，不上传任何数据。依次在「展开竖屏、展开横屏、合上竖屏、合上横屏」下点「记录当前状态」，最后点「复制全部记录」发回。</p>

<div class="verdict">
  <div class="pill">现行规则<b id="vNow">-</b><span id="vNowWhy"></span></div>
  <div class="pill">加条件 4 后<b id="vNew">-</b><span id="vNewWhy"></span></div>
</div>

<table id="cur"></table>

<div class="row">
  <select id="label">
    <option>展开·竖屏</option><option>展开·横屏</option><option>合上·竖屏</option><option>合上·横屏</option>
    <option>三折全开·竖屏</option><option>三折全开·横屏</option><option>其他</option>
  </select>
  <button class="primary" id="rec">记录当前状态</button>
  <button id="copy">复制全部记录</button>
</div>
<textarea id="out" readonly placeholder="记录会出现在这里，复制失败时可长按全选手动复制"></textarea>

<h2>记录</h2>
<table class="log" id="log"></table>

// PC 与 H5 两份必须逐字一致；只挂载平板规则，不修改业务端设备标记。
;(function () {
  const SWITCH_KEY = 'x9:tablet-switch'
  const REDIRECTS_KEY = 'x9:tablet-redirects'

  function isMacDisguisedIPad(uaResult, nav) {
    try {
      return nav.platform === 'MacIntel' && nav.maxTouchPoints > 0 && /Macintosh/.test(nav.userAgent)
    } catch {
      return false
    }
  }

  function isDesktopModeAndroidTablet(uaResult, nav) {
    try {
      return /X11; Linux x86_64/.test(nav.userAgent) &&
        /^Linux (arm|aarch)/i.test(nav.platform) &&
        nav.maxTouchPoints > 0 &&
        Math.min(window.screen.width, window.screen.height) >= 600
    } catch {
      return false
    }
  }

  function isTablet(uaResult, nav) {
    try {
      return uaResult?.device?.type === 'tablet' || isMacDisguisedIPad(uaResult, nav) || isDesktopModeAndroidTablet(uaResult, nav)
    } catch {
      return false
    }
  }

  function recommend(width, height) {
    try {
      if (height > width) return 'h5'
      return width >= 854 ? 'pc' : 'h5'
    } catch {
      return 'h5'
    }
  }

  function toAppPath(pathname, baseURL) {
    try {
      if (!baseURL || baseURL === '/') return pathname
      const base = baseURL.replace(/\/+$/, '')
      if (pathname === base) return '/'
      return pathname.startsWith(base + '/') ? pathname.slice(base.length) : pathname
    } catch {
      return pathname
    }
  }

  function inScope(project, path) {
    try {
      if (project === 'pc') {
        return path === '/' || path === '/main' || path === '/live' || path.startsWith('/room/')
      }
      return project === 'h5' && (path === '/' || path === '/live/idx' || path === '/live/detail')
    } catch {
      return false
    }
  }

  function takeSwitchTarget() {
    try {
      const target = window.sessionStorage.getItem(SWITCH_KEY)
      window.sessionStorage.removeItem(SWITCH_KEY)
      return target === 'pc' || target === 'h5' ? target : null
    } catch {
      return null
    }
  }

  function recentRedirects(now) {
    try {
      const records = JSON.parse(window.sessionStorage.getItem(REDIRECTS_KEY) || '[]')
      if (!Array.isArray(records) || !records.every((time) => Number.isFinite(time) && time >= 0 && time <= now)) return []
      return records.filter((time) => time > now - 10000)
    } catch {
      return []
    }
  }

  function canAutoRedirect() {
    try {
      return recentRedirects(Date.now()).length < 2
    } catch {
      return true
    }
  }

  function recordAutoRedirect() {
    try {
      const now = Date.now()
      const records = recentRedirects(now)
      records.push(now)
      window.sessionStorage.setItem(REDIRECTS_KEY, JSON.stringify(records))
    } catch {
      // 存储不可用时尽力而为，不中断入口分流。
    }
  }

  window.X9Tablet = { isTablet, isMacDisguisedIPad, isDesktopModeAndroidTablet, toAppPath, inScope, recommend, takeSwitchTarget, canAutoRedirect, recordAutoRedirect }
})()

;(function () {
  var X = window.X9Tablet
  var records = []
  var hints = { model: null, mobile: null }

  // Chromium 才有 userAgentData；机型只能异步拿到，作为补充信息记录
  try {
    if (navigator.userAgentData) {
      hints.mobile = navigator.userAgentData.mobile
      navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']).then(function (v) {
        hints.model = v.model || ''
        hints.platformVersion = v.platformVersion || ''
        render()
      }).catch(function () {})
    }
  } catch (e) {}

  function snapshot() {
    var ua = new UAParser(navigator.userAgent).getResult()
    var sw = screen.width, sh = screen.height
    var shortSide = Math.min(sw, sh)
    var touch = navigator.maxTouchPoints || 0
    var conds = {
      c1: ua.device.type === 'tablet',
      c2: X.isMacDisguisedIPad(ua, navigator),
      c3: X.isDesktopModeAndroidTablet(ua, navigator),
      // 草案条件 4：手机 UA + 有触摸 + 屏幕短边 ≥ 600（08 第六节）
      c4: ua.device.type === 'mobile' && touch > 0 && shortSide >= 600
    }
    var tabletNow = X.isTablet(ua, navigator)
    var tabletNew = tabletNow || conds.c4
    var rec = X.recommend(innerWidth, innerHeight)
    // 现行 PC 入口：先看平板，非平板时 mobile 进 H5、其余进 PC（index.html）
    var now = tabletNow ? rec : (ua.device.type === 'mobile' ? 'h5' : 'pc')
    var next = tabletNew ? rec : (ua.device.type === 'mobile' ? 'h5' : 'pc')
    return {

      ['platform', s.platform],
      ['条件 1～3', yes(s.conds.c1) + ' / ' + yes(s.conds.c2) + ' / ' + yes(s.conds.c3)],
      ['条件 4（草案）', yes(s.conds.c4)],
      ['UA', s.ua]
    ]
    document.getElementById('cur').innerHTML = rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>' }).join('')
  }

  function renderLog() {
    document.getElementById('log').innerHTML = records.map(function (r) {
      return '<tr><td>' + esc(r.label) + '</td><td>screen ' + esc(r.screen) + '，inner ' + esc(r.inner) + '，DPR ' + esc(r.dpr) + '<br>现行 ' + label(r.now) + ' → 改后 ' + label(r.next) + '</td></tr>'
    }).join('')
    document.getElementById('out').value = JSON.stringify(records, null, 1)
  }

  document.getElementById('rec').onclick = function () {
    var s = snapshot()
    s.label = document.getElementById('label').value
    records.push(s)
    renderLog()
  }

  document.getElementById('copy').onclick = function () {
    var text = JSON.stringify(records, null, 1)
    var out = document.getElementById('out')
    out.value = text
    var done = function () { document.getElementById('copy').textContent = '已复制 ' + records.length + ' 条' }
    try {
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, function () { out.select(); document.execCommand('copy'); done() }); return }
    } catch (e) {}
    out.select(); try { document.execCommand('copy'); done() } catch (e) {}
  }

  // 展开、合上、转屏都会触发 resize；地址栏伸缩也会，所以只刷新显示，不自动记录
  window.addEventListener('resize', render)
  window.addEventListener('orientationchange', function () { setTimeout(render, 300) })
  render()
})()
</script>
</body>
</html>
